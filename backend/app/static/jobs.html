<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Application Assistant · Jobs</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#18212f;background:#f4f7fa;--blue:#155eef;--line:#dce3eb;--muted:#647084}*{box-sizing:border-box}body{margin:0}
    header{background:#132033;color:#fff;padding:24px max(22px,calc((100% - 1120px)/2));display:flex;justify-content:space-between;align-items:center}h1{margin:0}.actions{display:flex;gap:16px}.nav-link{color:#fff;text-underline-offset:3px}
    main{max-width:1120px;margin:auto;padding:25px 22px}.filters{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:18px}label{font-size:12px;font-weight:700;color:var(--muted)}select{display:block;width:100%;margin-top:5px;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff}
    .list{display:grid;gap:10px}.job{display:grid;grid-template-columns:1fr auto;gap:15px;padding:15px;background:#fff;border:1px solid var(--line);border-radius:11px;color:inherit;text-decoration:none}.job:hover{border-color:#9bb9f5}.job strong{display:block}.job span{color:var(--muted);font-size:13px}.badge{align-self:center;padding:4px 9px;border-radius:999px;background:#e9eef6;font-size:12px}.empty{color:var(--muted)}
    @media(max-width:700px){header{align-items:flex-start;flex-direction:column;gap:15px}.filters{grid-template-columns:1fr}.job{grid-template-columns:1fr}}
  </style>
</head>
<body><header><h1>Jobs und Bewerbungen</h1><div class="actions"><a class="nav-link" href="/">Dashboard</a><a class="nav-link" href="/manage#job-import">Job importieren</a></div></header>
<main><div class="filters"><label>Profil<select id="profile"></select></label><label>Status<select id="status"><option value="">Alle</option><option value="open">Offen</option><option value="applied">Beworben</option><option value="followed_up">Nachgefragt</option><option value="interview">Gespräch</option><option value="rejected">Abgelehnt</option><option value="offer">Angebot</option></select></label><label>Matching<select id="matching"><option value="">Alle</option><option value="matched">Mit Matching</option><option value="unmatched">Ohne Matching</option></select></label></div><div class="list" id="list"></div></main>
<script>
const $=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),labels={draft:"Entwurf",applied:"Beworben",followed_up:"Nachgefragt",interview:"Gespräch",rejected:"Abgelehnt",offer:"Angebot",accepted:"Angenommen",withdrawn:"Zurückgezogen",closed:"Geschlossen"};
async function req(u){const r=await fetch(u),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error?.message||`HTTP ${r.status}`);return d}
let jobs=[],apps=[];
async function load(){const p=$("profile").value;if(!p)return;[jobs,apps]=await Promise.all([req(`/matching/jobs?profile_id=${encodeURIComponent(p)}`),req(`/applications?profile_id=${encodeURIComponent(p)}`)]);render()}
function sourceName(job){if(job.source_url){try{return new URL(job.source_url).origin}catch{}}return job.source_filename||job.source_portal||"Unbekannte Quelle"}
function render(){const byJob=new Map(apps.map(a=>[a.job_id,a])),status=$("status").value,matching=$("matching").value;let rows=jobs.map(j=>({job:j,app:byJob.get(j.id)}));if(status)rows=rows.filter(x=>status==="open"?!x.app:x.app?.status===status);if(matching)rows=rows.filter(x=>Boolean(x.job.has_matching)===(matching==="matched"));$("list").innerHTML=rows.length?rows.map(({job,app})=>`<a class="job" href="/jobs/${job.id}"><div><strong>${esc(job.title)}</strong><span>${esc(job.company||"Firma unbekannt")} · ${esc(sourceName(job))}</span></div><span class="badge">${esc(app?labels[app.status]||app.status:"Offen")} · ${job.has_matching?"mit":"ohne"} Matching</span></a>`).join(""):`<p class="empty">Keine Jobs für diesen Filter.</p>`}
async function init(){const profiles=await req("/profiles");$("profile").innerHTML=profiles.map(p=>`<option value="${p.id}">${esc(p.display_name)}</option>`).join("");["profile","status","matching"].forEach(id=>$(id).onchange=id==="profile"?load:render);await load()}init().catch(e=>$("list").innerHTML=`<p class="empty">${esc(e.message)}</p>`);
</script></body></html>
