<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Application Assistant · Jobs</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#18212f;background:#f4f7fa;--blue:#155eef;--line:#dce3eb;--muted:#647084}*{box-sizing:border-box}body{margin:0}
    header{background:#132033;color:#fff;padding:24px max(22px,calc((100% - 1120px)/2));display:flex;justify-content:space-between;align-items:center;gap:18px}h1{margin:0}.actions{display:flex;gap:8px;flex-wrap:wrap}.nav-link{color:#d8e2f0;text-decoration:none;padding:8px 10px;border-radius:7px}.nav-link:hover,.nav-link.active{color:#fff;background:#ffffff18}.nav-link.active{font-weight:750}
    main{max-width:1120px;margin:auto;padding:25px 22px}.page-intro{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:20px}.page-intro h2{margin:0 0 4px;font-size:20px}.page-intro p{margin:0;color:var(--muted);font-size:14px}.button{border-radius:8px;background:var(--blue);color:#fff;padding:10px 14px;font-weight:700;text-decoration:none;white-space:nowrap}.filters{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:18px;padding:16px;background:#fff;border:1px solid var(--line);border-radius:11px}label{font-size:12px;font-weight:700;color:var(--muted)}select{display:block;width:100%;margin-top:5px;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff}
    .list{display:grid;gap:10px}.job{display:grid;grid-template-columns:1fr auto;gap:15px;padding:15px;background:#fff;border:1px solid var(--line);border-radius:11px;color:inherit;text-decoration:none}.job:hover{border-color:#9bb9f5}.job strong{display:block}.job span{color:var(--muted);font-size:13px}.badge{align-self:center;padding:4px 9px;border-radius:999px;background:#e9eef6;font-size:12px}.empty{color:var(--muted)}
    @media(max-width:700px){header,.page-intro{align-items:flex-start;flex-direction:column;gap:15px}.filters{grid-template-columns:1fr}.job{grid-template-columns:1fr}}
  </style>
</head>
<body><header><h1>Jobs und Bewerbungen</h1><nav class="actions" aria-label="Hauptnavigation"><a class="nav-link" href="/">Dashboard</a><a class="nav-link active" aria-current="page" href="/jobs">Jobs und Bewerbungen</a><a class="nav-link" href="/manage">Verwaltung</a></nav></header>
<main><div class="page-intro"><div><h2>Gesamter Stellenbestand</h2><p>Aktive Stellen und Archiv durchsuchen; Matching und Bewerbungsverlauf bleiben am Job gebündelt.</p></div><a class="button" href="/manage#job-import">Stelle importieren</a></div><div class="filters"><label>Profil<select id="profile"></select></label><label>Status<select id="status"><option value="">Aktive Jobs</option><option value="archived">Archiv</option><option value="open">Offen</option><option value="applied">Beworben</option><option value="followed_up">Nachgefragt</option><option value="interview">Gespräch</option><option value="rejected">Abgelehnt</option><option value="offer">Angebot</option></select></label><label>Matching<select id="matching"><option value="">Alle</option><option value="matched">Mit Matching</option><option value="unmatched">Ohne Matching</option></select></label></div><div class="list" id="list"></div></main>
<script>
const $=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),labels={draft:"Entwurf",applied:"Beworben",followed_up:"Nachgefragt",interview:"Gespräch",rejected:"Abgelehnt",offer:"Angebot",accepted:"Angenommen",withdrawn:"Zurückgezogen",closed:"Geschlossen"};
async function req(u){const r=await fetch(u),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error?.message||`HTTP ${r.status}`);return d}
let jobs=[],apps=[];
async function load(){const p=$("profile").value;if(!p)return;[jobs,apps]=await Promise.all([req(`/matching/jobs?profile_id=${encodeURIComponent(p)}&include_archived=true`),req(`/applications?profile_id=${encodeURIComponent(p)}`)]);render()}
const date=value=>value?new Intl.DateTimeFormat("de-DE",{dateStyle:"medium"}).format(new Date(value)):"ohne Datum";
const jobKey=job=>`${job.title||""}\u0000${job.company||""}`.toLocaleLowerCase("de");
function render(){const byJob=new Map(apps.map(a=>[a.job_id,a])),status=$("status").value,matching=$("matching").value,counts=jobs.reduce((m,j)=>m.set(jobKey(j),(m.get(jobKey(j))||0)+1),new Map());let rows=jobs.map(j=>({job:j,app:byJob.get(j.id)}));rows=rows.filter(x=>status==="archived"?Boolean(x.job.archived_at):!x.job.archived_at);if(status&&status!=="archived")rows=rows.filter(x=>status==="open"?!x.app:x.app?.status===status);if(matching)rows=rows.filter(x=>Boolean(x.job.has_matching)===(matching==="matched"));$("list").innerHTML=rows.length?rows.map(({job,app})=>`<a class="job" href="/jobs/${job.id}"><div><strong>${esc(job.title)}</strong><span>${esc(job.company||"Firma unbekannt")}${counts.get(jobKey(job))>1?` · importiert ${esc(date(job.imported_at))}`:""}${job.archive_reason?` · ${esc(job.archive_reason)}`:""}</span></div><span class="badge">${job.archived_at?"Archiviert":esc(app?labels[app.status]||app.status:"Offen")} · ${job.has_matching?"mit":"ohne"} Matching</span></a>`).join(""):`<p class="empty">Keine Jobs für diesen Filter.</p>`}
async function init(){const profiles=await req("/profiles");$("profile").innerHTML=profiles.map(p=>`<option value="${p.id}">${esc(p.display_name)}</option>`).join("");["profile","status","matching"].forEach(id=>$(id).onchange=id==="profile"?load:render);await load()}init().catch(e=>$("list").innerHTML=`<p class="empty">${esc(e.message)}</p>`);
</script></body></html>
