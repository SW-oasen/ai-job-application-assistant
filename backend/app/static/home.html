<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Application Assistant · Dashboard</title>
  <style>
    :root{font-family:Inter,system-ui,"Segoe UI",sans-serif;color:#18212f;background:#f4f7fa;--blue:#155eef;--line:#dce3eb;--muted:#647084}
    *{box-sizing:border-box}body{margin:0}header{background:#132033;color:#fff;padding:28px max(22px,calc((100% - 1180px)/2));display:flex;justify-content:space-between;align-items:center;gap:20px}
    h1{margin:0 0 5px;font-size:28px}header p{margin:0;color:#c9d4e4}.actions{display:flex;gap:8px;flex-wrap:wrap}.nav-link{color:#d8e2f0;text-decoration:none;padding:8px 10px;border-radius:7px}.nav-link:hover,.nav-link.active{color:#fff;background:#ffffff18}.nav-link.active{font-weight:750}
    .button{border:0;border-radius:8px;background:var(--blue);color:#fff;padding:10px 15px;font-weight:700;text-decoration:none;display:inline-block}.button.secondary{background:#e9eef6;color:#27364a}
    main{max-width:1180px;margin:auto;padding:26px 22px 60px}.toolbar{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:20px;flex-wrap:wrap}.toolbar-fields{display:flex;align-items:end;gap:14px;flex-wrap:wrap}.toolbar label{font-size:12px;font-weight:700;color:var(--muted)}select,input[type=search]{display:block;margin-top:5px;min-width:200px;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;font:inherit}
    .panel{background:#fff;border:1px solid var(--line);border-radius:13px;padding:20px;margin-top:20px}.panel h2{margin:0 0 14px;font-size:19px}.panel h2 .count{font-size:14px;font-weight:600;color:var(--blue);margin-left:8px}.list{display:grid;gap:9px}.item{display:block;padding:12px;border:1px solid var(--line);border-radius:9px;color:inherit;text-decoration:none}.item:hover{border-color:#9bb9f5}.item strong{display:block}.item span,.empty{color:var(--muted);font-size:12px}.status{display:inline-block;margin-top:5px;padding:2px 7px;border-radius:999px;background:#e9eef6;color:#27364a;font-size:11px}
    [hidden]{display:none!important}@media(max-width:850px){header,.toolbar{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
<header>
  <div><h1>Bewerbungsassistent</h1><p>Aktueller Arbeitsstand, Rückmeldungen und nächste Entscheidungen.</p></div>
  <nav class="actions" aria-label="Hauptnavigation"><a class="nav-link active" aria-current="page" href="/">Jobs und Bewerbungen</a><a class="nav-link" href="/manage">Verwaltung</a></nav>
</header>
<main>
  <div class="toolbar"><div class="toolbar-fields"><label for="profile">Profil<select id="profile"></select></label><label for="search">Suche<input id="search" type="search" placeholder="Titel, Firma, Ort, Stichwort"></label><label for="status">Status<select id="status"><option value="">Alle</option><option value="open">Offen</option><option value="applied">Beworben</option><option value="followed_up">Nachgefragt</option><option value="interview">Gespräch</option><option value="rejected">Abgelehnt</option><option value="offer">Angebot</option><option value="accepted">Angenommen</option><option value="withdrawn">Zurückgezogen</option><option value="closed">Geschlossen</option><option disabled>---</option><option value="archived">Archiv</option></select></label><label for="matching">Matching<select id="matching"><option value="">Alle</option><option value="matched">Mit Matching</option><option value="unmatched">Ohne Matching</option></select></label></div></div>
  <section class="panel" id="applicationsPanel"><h2 id="applicationsTitle">Aktuelle Bewerbungen<span class="count" id="applicationsCount"></span></h2><div class="list" id="applications"></div></section>
</main>
<script>
const $=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const labels={draft:"Entwurf",applied:"Beworben",followed_up:"Nachgefragt",interview:"Vorstellungsgespräch",rejected:"Abgelehnt",offer:"Angebot",accepted:"Angenommen",withdrawn:"Zurückgezogen",closed:"Geschlossen"};
const channels={email:"E-Mail",company_portal:"Arbeitgeberportal",job_portal:"Jobportal",phone:"Telefon",personal:"Persönlich",other:"Sonstiges"};
const date=value=>value?new Intl.DateTimeFormat("de-DE",{dateStyle:"medium"}).format(new Date(value)):"ohne Datum";
let dashboardJobs=[],dashboardApps=[];
async function req(url){const r=await fetch(url),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error?.message||`HTTP ${r.status}`);return d}
function normalized(value){return String(value??"").normalize("NFD").replace(/\p{Diacritic}/gu,"").toLocaleLowerCase("de")}
function jobKey(job){return `${job.title||""}\u0000${job.company||""}`.toLocaleLowerCase("de")}
function searchable(job){return normalized([job.title,job.company,job.location,job.work_model,job.employment_type,job.source_portal].filter(Boolean).join(" "))}
function render(){
  const terms=normalized($("search").value).trim().split(/\s+/).filter(Boolean);
  const status=$("status").value,matching=$("matching").value;
  const archiveFilter=status==="archived";
  let jobs=terms.length?dashboardJobs.filter(job=>{const text=searchable(job);return terms.every(term=>text.includes(term))}):dashboardJobs;
  jobs=jobs.filter(job=>Boolean(job.archived_at)===archiveFilter);
  if(matching)jobs=jobs.filter(job=>Boolean(job.has_matching)===(matching==="matched"));
  const jobCounts=dashboardJobs.reduce((counts,job)=>counts.set(jobKey(job),(counts.get(jobKey(job))||0)+1),new Map());
  const jobIds=new Set(jobs.map(job=>job.id));
  let apps=dashboardApps.filter(app=>jobIds.has(app.job_id));
  const byJob=new Map(apps.map(a=>[a.job_id,a]));
  let open=jobs.filter(j=>!byJob.has(j.id));
  const openFilter=status==="open";
  if(status&&!archiveFilter&&!openFilter)apps=apps.filter(a=>a.status===status);
  $("applicationsTitle").firstChild.textContent=archiveFilter?"Archivierte Jobs":openFilter?"Offene Jobs":status?labels[status]||"Gefilterte Bewerbungen":"Aktuelle Bewerbungen";
  $("applicationsCount").textContent=archiveFilter?jobs.length:openFilter?open.length:apps.length;
  if(archiveFilter){
    $("applications").innerHTML=jobs.length?jobs.map(j=>`<a class="item" href="/jobs/${j.id}"><strong>${esc(j.title)}</strong><span>${esc(j.company||"Firma unbekannt")}${jobCounts.get(jobKey(j))>1?` · importiert ${esc(date(j.imported_at))}`:""}</span></a>`).join(""):`<p class="empty">Keine passenden archivierten Jobs.</p>`;
  }else if(openFilter){
    $("applications").innerHTML=open.length?open.map(j=>`<a class="item" href="/jobs/${j.id}"><strong>${esc(j.title)}</strong><span>${esc(j.company||"Firma unbekannt")}${jobCounts.get(jobKey(j))>1?` · importiert ${esc(date(j.imported_at))}`:""}</span></a>`).join(""):`<p class="empty">Keine passenden offenen Jobs.</p>`;
  }else{
    $("applications").innerHTML=apps.length?apps.map(a=>`<a class="item" href="/jobs/${a.job_id}"><strong>${esc(a.job.title)}</strong><span>${esc(a.job.company||"Firma unbekannt")}${jobCounts.get(jobKey(a.job))>1?` · importiert ${esc(date(a.job.imported_at))}`:""}</span><i class="status">${esc(labels[a.status]||a.status)} · ${esc(date(a.status_changed_at))}</i></a>`).join(""):`<p class="empty">Keine passenden Bewerbungen.</p>`;
  }
}
async function loadDashboard(){
  const profileId=$("profile").value;if(!profileId)return;
  [dashboardJobs,dashboardApps]=await Promise.all([req(`/matching/jobs?profile_id=${encodeURIComponent(profileId)}&include_archived=true`),req(`/applications?profile_id=${encodeURIComponent(profileId)}`)]);
  render();
}
async function init(){try{const profiles=await req("/profiles");$("profile").innerHTML=profiles.map(p=>`<option value="${p.id}">${esc(p.display_name)}</option>`).join("");$("profile").onchange=loadDashboard;$("search").oninput=render;$("status").onchange=render;$("matching").onchange=render;await loadDashboard()}catch(e){$("applications").innerHTML=`<p class="empty">${esc(e.message)}</p>`}}init();
</script>
</body>
</html>
