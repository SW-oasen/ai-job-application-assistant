<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Application Assistant · Dashboard</title>
  <style>
    :root{font-family:Inter,system-ui,"Segoe UI",sans-serif;color:#18212f;background:#f4f7fa;--blue:#0F766E;--line:#dce3eb;--muted:#647084}
    *{box-sizing:border-box}html{scrollbar-gutter:stable}body{margin:0}header{background:#132033;color:#fff;padding:22px 32px;display:flex;justify-content:space-between;align-items:center;gap:20px}
    h1{margin:0 0 5px;font-size:28px}header p{margin:0;color:#c9d4e4}.actions{display:flex;gap:8px;flex-wrap:wrap}.nav-link,.nav-profile{color:#d8e2f0;text-decoration:none;padding:8px 10px;border-radius:7px;font-size:14px}.nav-profile{border-color:#f4f7fa;background:#f4f7fa;color:#132033;cursor:default}.nav-link:hover,.nav-link.active{color:#fff;background:#ffffff18}.nav-link.active{font-weight:750}
    .button{border:1px solid var(--blue);border-radius:8px;background:var(--blue);color:#fff;padding:9px 12px;font:700 13px/1.25 inherit;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.button:not(.secondary):hover{background:#0B5F59;border-color:#0B5F59}.button.secondary{background:#fff;border-color:var(--line);color:#34445b}
    main{width:100%;margin:0;padding:18px 32px 48px}.dashboard-grid{display:grid;grid-template-columns:minmax(300px,.72fr) minmax(620px,1.8fr);gap:14px;align-items:start}.dashboard-column{display:grid;gap:14px;align-content:start}.toolbar{display:flex;justify-content:space-between;align-items:end;gap:14px;margin:0;flex-wrap:wrap}.toolbar-fields{display:flex;align-items:end;gap:12px;flex-wrap:wrap}.toolbar label{font-size:12px;font-weight:700;color:var(--muted)}select,input[type=search]{display:block;margin-top:5px;min-width:200px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font:inherit}.sort-direction{width:38px;height:38px;border:1px solid var(--line);border-radius:8px;background:#fff;color:#34445b;font:700 19px/1 inherit;cursor:pointer}.sort-direction:hover{border-color:#91b4f5;background:#edf3ff;color:#0f3d98}
    .panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;margin:0}.panel h2{margin:0 0 10px;font-size:18px}.panel h2 .count{font-size:14px;font-weight:600;color:var(--blue);margin-left:8px}.list{display:grid;gap:7px}.item{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:8px;color:inherit;text-decoration:none}.item:hover{border-color:#9bb9f5;background:#f8fbff}.item strong{display:block}.item span,.empty{color:var(--muted);font-size:12px}.archive-reason{font-size:11px;color:#7a8492}.status{display:inline-block;margin-top:5px;padding:2px 7px;border-radius:999px;background:#e9eef6;color:#27364a;font-size:11px}.status-filter{display:flex;flex-wrap:wrap;gap:6px}.status-filter button{padding:7px 9px;border:1px solid var(--line);border-radius:999px;background:#fff;color:#34445b;font:650 12px/1.2 inherit;cursor:pointer}.status-filter button:hover,.status-filter button.active{border-color:#91b4f5;background:#edf3ff;color:#0f3d98}.status-filter button.active{font-weight:750}.stats{display:grid;gap:8px}.stat-row{display:grid;grid-template-columns:110px 1fr 30px;align-items:center;gap:8px;font-size:12px}.stat-bar{height:7px;border-radius:999px;background:#edf1f6;overflow:hidden}.stat-bar i{display:block;height:100%;border-radius:inherit;background:#9bb9f5}.stat-row strong{text-align:right;font-size:12px;color:#34445b}.list-toolbar{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:12px}
    [hidden]{display:none!important}.dashboard-links{display:flex;gap:8px;flex-wrap:wrap}.stats{display:grid;gap:8px}.stat-row{display:grid;grid-template-columns:135px minmax(0,1fr) 24px;align-items:center;gap:9px;font-size:12px}.stat-row>span{white-space:nowrap}.stat-bar{height:7px;border-radius:999px;background:#edf1f6;overflow:hidden}.stat-bar i{display:block;height:100%;border-radius:inherit;background:#9bb9f5}.stat-row strong{text-align:right;font-size:12px;color:#34445b}.status-filter{display:flex;flex-wrap:wrap;gap:6px}.status-filter button{padding:7px 9px;border:1px solid var(--line);border-radius:999px;background:#fff;color:#34445b;font:650 12px/1.2 inherit;cursor:pointer}.status-filter button:hover,.status-filter button.active{border-color:#91b4f5;background:#edf3ff;color:#0f3d98}.status-filter button.active{font-weight:750}.dashboard-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:14px;align-items:start}.dashboard-column{display:grid;gap:14px;align-content:start;min-width:0}.dashboard-column>.panel{margin:0}.toolbar{margin:0}.toolbar-fields label:has(#status){display:none}.list-toolbar{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:12px}header .nav-profile{background:#f4f7fa!important;color:#132033!important;border:1px solid #f4f7fa!important}
  </style>
</head>
<body>
<header>
  <div><h1>Bewerbungsassistent</h1><p>Aktueller Arbeitsstand, Rückmeldungen und nächste Entscheidungen.</p></div>
  <nav class="actions" aria-label="Hauptnavigation"><span class="nav-profile" id="active-profile" aria-live="polite">Kein Profil geladen</span><a class="nav-link active" aria-current="page" href="/">Jobs und Bewerbungen</a><a class="nav-link" href="/manage">Verwaltung</a></nav>
</header>
<main>
  <div class="dashboard-grid">
    <aside class="dashboard-column">
      <section class="panel"><h2>Bewerbungsstatus</h2><div class="status-filter" id="statusFilters"><button type="button" data-status="open">Offen</button><button type="button" data-status="applied">Beworben</button><button type="button" data-status="followed_up">Nachgefragt</button><button type="button" data-status="interview">Gespräch</button><button type="button" data-status="rejected">Abgelehnt</button><button type="button" data-status="offer">Angebot</button><button type="button" data-status="accepted">Angenommen</button><button type="button" data-status="withdrawn">Zurückgezogen</button><button type="button" data-status="closed">Geschlossen</button><button type="button" data-status="archived">Archiv</button></div></section>
      <section class="panel"><h2>Statusübersicht</h2><div class="stats" id="statusStats"></div></section>
      <section class="panel dashboard-links"><a class="button secondary" href="/manage#panel-profile-new">Profil bearbeiten</a><a class="button" href="/manage#panel-import">Job importieren</a></section>
    </aside>
    <div class="dashboard-column" id="dashboardRight">
  <div class="toolbar"><div class="toolbar-fields"><label for="profile">Profil<select id="profile"></select></label><label for="search">Suche<input id="search" type="search" placeholder="Titel, Firma, Ort, Stichwort"></label><label for="status">Status<select id="status"><option value="">Alle</option><option value="open">Offen</option><option value="applied">Beworben</option><option value="followed_up">Nachgefragt</option><option value="interview">Gespräch</option><option value="rejected">Abgelehnt</option><option value="offer">Angebot</option><option value="accepted">Angenommen</option><option value="withdrawn">Zurückgezogen</option><option value="closed">Geschlossen</option><option disabled>---</option><option value="archived">Archiv</option></select></label><label for="sortBy">Sortieren nach<select id="sortBy"><option value="last_action">Letzte Aktion</option><option value="company">Firmenname</option><option value="imported_at">Importdatum</option></select></label><button class="sort-direction" id="sortDirection" type="button" aria-label="Absteigend sortieren" title="Absteigend sortieren">↓</button></div></div>
  <section class="panel" id="applicationsPanel"><h2 id="applicationsTitle">Aktuelle Bewerbungen<span class="count" id="applicationsCount"></span></h2><div class="list" id="applications"></div></section>
</div>
  </div>
</main>
<script>
const $=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const labels={draft:"Entwurf",applied:"Beworben",followed_up:"Nachgefragt",interview:"Vorstellungsgespräch",rejected:"Abgelehnt",offer:"Angebot",accepted:"Angenommen",withdrawn:"Zurückgezogen",closed:"Geschlossen"};
const channels={email:"E-Mail",company_portal:"Arbeitgeberportal",job_portal:"Jobportal",phone:"Telefon",personal:"Persönlich",other:"Sonstiges"};
const date=value=>value?new Intl.DateTimeFormat("de-DE",{dateStyle:"medium"}).format(new Date(value)):"ohne Datum";
$("status")?.closest("label")?.remove();
let dashboardJobs=[],dashboardApps=[],selectedStatuses=new Set(),sortDirection="desc";
async function req(url){const r=await fetch(url),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error?.message||`HTTP ${r.status}`);return d}
function normalized(value){return String(value??"").normalize("NFD").replace(/\p{Diacritic}/gu,"").toLocaleLowerCase("de")}
function jobKey(job){return `${job.title||""}\u0000${job.company||""}`.toLocaleLowerCase("de")}
function searchable(job){return normalized([job.title,job.company,job.location,job.work_model,job.employment_type,job.source_portal].filter(Boolean).join(" "))}
function renderStats(){const counts={open:dashboardJobs.filter(job=>!job.archived_at&&!dashboardApps.some(app=>app.job_id===job.id)).length,applied:0,followed_up:0,interview:0,rejected:0,offer:0,accepted:0,withdrawn:0,closed:0,archived:dashboardJobs.filter(job=>Boolean(job.archived_at)).length};dashboardApps.forEach(app=>{if(Object.prototype.hasOwnProperty.call(counts,app.status))counts[app.status]++});const max=Math.max(1,...Object.values(counts));$("statusStats").innerHTML=Object.entries(counts).map(([key,count])=>`<div class="stat-row"><span>${esc(key==="open"?"Offen":key==="archived"?"Archiv":labels[key]||key)}</span><div class="stat-bar"><i style="width:${Math.round(count/max*100)}%"></i></div><strong>${count}</strong></div>`).join("")}
function render(){
  renderStats();
  const terms=normalized($("search").value).trim().split(/\s+/).filter(Boolean);
  const status=[...selectedStatuses],sortBy=$("sortBy").value;
  let jobs=terms.length?dashboardJobs.filter(job=>{const text=searchable(job);return terms.every(term=>text.includes(term))}):dashboardJobs;
  const appByJob=new Map(dashboardApps.map(app=>[app.job_id,app]));
  jobs=jobs.filter(job=>!status.length||status.some(value=>value==="archived"&&Boolean(job.archived_at)||value==="open"&&!job.archived_at&&!appByJob.has(job.id)||!job.archived_at&&appByJob.get(job.id)&&appByJob.get(job.id).status===value));
  jobs=[...jobs].sort((left,right)=>{
    const value=job=>sortBy==="company"?String(job.company||"").toLocaleLowerCase("de"):sortBy==="imported_at"?new Date(job.imported_at||0).getTime():new Date(appByJob.get(job.id)?.status_changed_at||job.imported_at||0).getTime();
    const leftValue=value(left),rightValue=value(right);
    let comparison=typeof leftValue==="string"?leftValue.localeCompare(rightValue,"de"):leftValue-rightValue;
    if(!comparison)comparison=String(left.title||"").localeCompare(String(right.title||""),"de");
    return sortDirection==="asc"?comparison:-comparison;
  });
  const jobCounts=dashboardJobs.reduce((counts,job)=>counts.set(jobKey(job),(counts.get(jobKey(job))||0)+1),new Map());
  let apps=jobs.map(job=>appByJob.get(job.id)).filter(Boolean);
  const byJob=new Map(apps.map(a=>[a.job_id,a]));
  let open=jobs.filter(j=>!byJob.has(j.id));
  const archiveFilter=status.length===1&&status[0]==="archived",openFilter=status.length===1&&status[0]==="open";
  if(status.length&&!archiveFilter&&!openFilter)apps=apps.filter(a=>status.includes(a.status));
  $("applicationsTitle").firstChild.textContent=archiveFilter?"Archivierte Jobs":openFilter?"Offene Jobs":status.length?"Gefilterte Jobs & Bewerbungen":"Jobs & Bewerbungen";
  $("applicationsCount").textContent=archiveFilter?jobs.length:openFilter?open.length:apps.length+open.length;
  if(archiveFilter){
    $("applications").innerHTML=jobs.length?jobs.map(j=>`<a class="item" href="/jobs/${j.id}"><strong>${esc(j.title)}</strong><span>${esc(j.company||"Firma unbekannt")}${jobCounts.get(jobKey(j))>1?` · importiert ${esc(date(j.imported_at))}`:""} <small class="archive-reason">· Archivierungsgrund: ${esc(j.archive_reason||"nicht angegeben")}</small></span></a>`).join(""):`<p class="empty">Keine passenden archivierten Jobs.</p>`;
  }else if(openFilter){
    $("applications").innerHTML=open.length?open.map(j=>`<a class="item" href="/jobs/${j.id}"><strong>${esc(j.title)}</strong><span>${esc(j.company||"Firma unbekannt")}${jobCounts.get(jobKey(j))>1?` · importiert ${esc(date(j.imported_at))}`:""}</span></a>`).join(""):`<p class="empty">Keine passenden offenen Jobs.</p>`;
  }else{
    $("applications").innerHTML=apps.length?apps.map(a=>`<a class="item" href="/jobs/${a.job_id}"><strong>${esc(a.job.title)}</strong><span>${esc(a.job.company||"Firma unbekannt")}${jobCounts.get(jobKey(a.job))>1?` · importiert ${esc(date(a.job.imported_at))}`:""}</span><i class="status">${esc(labels[a.status]||a.status)} · ${esc(date(a.status_changed_at))}</i></a>`).join(""):`<p class="empty">Keine passenden Bewerbungen.</p>`;
  }
}
async function loadDashboard(){
  const profileId=localStorage.getItem("managedProfileId");if(!profileId)return;
  [dashboardJobs,dashboardApps]=await Promise.all([req(`/matching/jobs?profile_id=${encodeURIComponent(profileId)}&include_archived=true`),req(`/applications?profile_id=${encodeURIComponent(profileId)}`)]);
  render();
}
async function init(){try{const profiles=await req("/profiles");$("profile").innerHTML=profiles.map(p=>`<option value="${p.id}">${esc(p.display_name)}</option>`).join("");$("profile").onchange=loadDashboard;$("search").oninput=render;$("sortBy").onchange=render;$("sortDirection").onclick=()=>{sortDirection=sortDirection==="desc"?"asc":"desc";const button=$("sortDirection"),ascending=sortDirection==="asc",label=ascending?"Aufsteigend sortieren":"Absteigend sortieren";button.textContent=ascending?"↑":"↓";button.title=label;button.setAttribute("aria-label",label);render()};document.querySelectorAll("#statusFilters button").forEach(button=>button.onclick=()=>{const value=button.dataset.status;selectedStatuses.has(value)?selectedStatuses.delete(value):selectedStatuses.add(value);button.classList.toggle("active",selectedStatuses.has(value));render()});await loadDashboard()}catch(e){$("applications").innerHTML=`<p class="empty">${esc(e.message)}</p>`}}init();
</script>
<script>document.querySelector("#statusFilters")?.previousElementSibling?.replaceChildren(document.createTextNode("Filter nach Bewerbungsstatus"));</script>
<style>.item strong{display:inline;font-size:15px;font-weight:700}.item span{display:inline;font-size:15px;font-weight:400;margin-left:8px}.item span::before{content:"·";display:inline-block;margin-right:8px;font-weight:700}.item .status{display:inline-block;margin:0 0 0 8px;width:auto}.item .status::before{content:"·";display:inline-block;margin-right:8px;font-weight:700}</style>
<script>
(() => {
  const statusPanel = document.querySelector("#statusFilters")?.closest(".panel");
  if (statusPanel && !$("actionRecommendations")) statusPanel.insertAdjacentHTML("afterend", '<section class="panel"><h2>Empfehlungen für Aktionen</h2><div class="action-recommendations" id="actionRecommendations"></div></section>');
  let actionFilter = "";
  const daysAgo = days => Date.now() - days * 24 * 60 * 60 * 1000;
  const actionMatches = () => {
    const now = Date.now();
    return {
      interview_due: dashboardApps.filter(app => { const appointment = app.upcoming_interview_at || app.next_action_at, time = new Date(appointment).getTime(); return app.status === "interview" && appointment && time >= now && time < now + 3 * 24 * 60 * 60 * 1000; }),
      applied_overdue: dashboardApps.filter(app => app.status === "applied" && app.applied_at && new Date(app.applied_at).getTime() < daysAgo(14)),
      followed_up_overdue: dashboardApps.filter(app => app.status === "followed_up" && app.status_changed_at && new Date(app.status_changed_at).getTime() < daysAgo(21))
    };
  };
  const dateTime = value => new Intl.DateTimeFormat("de-DE", {dateStyle:"medium", timeStyle:"short"}).format(new Date(value));
  const renderRecommendations = () => {
    const host = $("actionRecommendations");
    if (!host) return;
    const matches = actionMatches();
    const interview = matches.interview_due.map(app => { const appointment = app.upcoming_interview_at || app.next_action_at; return `<div class="action-recommendation"><button type="button" data-action-filter="interview_due">Anstehendes Gespräch</button><span>${esc(app.job.title)} · ${esc(app.job.company || "Firma unbekannt")} · ${esc(dateTime(appointment))}</span></div>`; }).join("");
    const applied = matches.applied_overdue.length ? `<div class="action-recommendation"><button type="button" data-action-filter="applied_overdue">Beworben seit mehr als 14 Tagen</button><span>${matches.applied_overdue.length} ${matches.applied_overdue.length === 1 ? "Stelle" : "Stellen"} · ggf. nachfragen</span></div>` : "";
    const followedUp = matches.followed_up_overdue.length ? `<div class="action-recommendation"><button type="button" data-action-filter="followed_up_overdue">Nachgefragt seit mehr als 21 Tagen</button><span>${matches.followed_up_overdue.length} ${matches.followed_up_overdue.length === 1 ? "Stelle" : "Stellen"}</span></div>` : "";
    host.innerHTML = interview + applied + followedUp || '<p class="empty">Aktuell keine Aktion erforderlich.</p>';
    host.querySelectorAll("[data-action-filter]").forEach(button => { button.classList.toggle("active", button.dataset.actionFilter === actionFilter); button.onclick = () => { actionFilter = actionFilter === button.dataset.actionFilter ? "" : button.dataset.actionFilter; selectedStatuses.clear(); document.querySelectorAll("#statusFilters button").forEach(item => item.classList.remove("active")); render(); }; });
  };
  const applyActionFilter = () => {
    if (!actionFilter) return;
    const allowed = new Set(actionMatches()[actionFilter].map(app => app.job_id));
    document.querySelectorAll("#applications .item").forEach(item => { item.hidden = !allowed.has(decodeURIComponent(item.getAttribute("href").split("/").pop())); });
    const visible = document.querySelectorAll("#applications .item:not([hidden])").length;
    $("applicationsTitle").firstChild.textContent = actionFilter === "interview_due" ? "Anstehende Gespräche" : actionFilter === "applied_overdue" ? "Beworben seit mehr als 14 Tagen" : "Nachgefragt seit mehr als 21 Tagen";
    $("applicationsCount").textContent = visible;
    if (!visible) $("applications").innerHTML = '<p class="empty">Keine passenden Bewerbungen.</p>';
  };
  const baseRender = render;
  render = () => { baseRender(); renderRecommendations(); applyActionFilter(); };
  document.querySelectorAll("#statusFilters button").forEach(button => button.addEventListener("click", () => { actionFilter = ""; }));
  const style = document.createElement("style");
  style.textContent = '.action-recommendations{display:grid;gap:8px}.action-recommendation{display:flex;align-items:center;gap:8px;min-width:0}.action-recommendation button{flex:0 0 auto;padding:7px 9px;border:1px solid var(--line);border-radius:999px;background:#fff;color:#34445b;font:650 12px/1.2 inherit;cursor:pointer}.action-recommendation button:hover,.action-recommendation button.active{border-color:#91b4f5;background:#edf3ff;color:#0f3d98}.action-recommendation span{min-width:0;color:var(--muted);font-size:12px}';
  document.head.append(style);
})();
</script>
<script>
(() => {
  const profileControl = document.getElementById("profile")?.closest("label"); if (profileControl) profileControl.hidden = true;
  const updateActiveProfile = async () => {
    const profiles = await req("/profiles"), id = localStorage.getItem("managedProfileId"), profile = profiles.find(item => item.id === id);
    document.getElementById("active-profile").textContent = profile ? `Profil: ${profile.display_name}` : "Kein Profil geladen";
    if (profile) await loadDashboard();
  };
  updateActiveProfile().catch(error => { document.getElementById("applications").innerHTML = `<p class="empty">${esc(error.message)}</p>`; });
})();
</script>
</body>
</html>
