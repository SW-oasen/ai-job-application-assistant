<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Application Assistant · Jobdetails</title>
  <style>
    :root{font-family:Inter,system-ui,"Segoe UI",sans-serif;color:#18212f;background:#f4f7fa;--blue:#155eef;--line:#dce3eb;--muted:#647084}
    *{box-sizing:border-box}body{margin:0}header{background:#132033;color:#fff;padding:24px max(22px,calc((100% - 1050px)/2));display:flex;justify-content:space-between;align-items:center;gap:18px}
    header h1{margin:0;font-size:25px}header p{margin:5px 0 0;color:#c9d4e4}.actions{display:flex;gap:16px;flex-wrap:wrap}.nav-link{color:#fff;text-underline-offset:3px}
    .button{border:0;border-radius:8px;background:var(--blue);color:#fff;padding:10px 15px;font-weight:700;text-decoration:none;display:inline-block;cursor:pointer}.button:hover{background:#0f4dcc}.button:focus-visible{outline:3px solid #91b4ff;outline-offset:2px}.button:disabled{cursor:not-allowed;opacity:.6}.button.secondary{background:#e9eef6;color:#27364a}.button.secondary:hover{background:#d9e2ef}.button.strong{background:#193a63;color:#fff}.button.strong:hover{background:#102a49}
    main{max-width:1050px;margin:auto;padding:26px 22px 60px}.panel{background:#fff;border:1px solid var(--line);border-radius:13px;padding:22px;margin-bottom:18px}
    .meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.meta div{padding:11px;border-radius:9px;background:#f6f8fb}.meta strong{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
    .content{overflow-wrap:anywhere;line-height:1.62}.content h1{font-size:1.55rem;margin:1.5em 0 .55em}.content h2{font-size:1.35rem;margin:1.4em 0 .5em}.content h3,.content h4{font-size:1.12rem;margin:1.25em 0 .45em}.content p{margin:.65em 0}.content ul,.content ol{padding-left:1.55rem}.content li{margin:.35em 0}.content blockquote{margin:1em 0;padding:.15em 1em;border-left:4px solid #b9c8dd;background:#f6f8fb;color:#40506a}.content a{color:var(--blue)}.content pre{overflow:auto;padding:12px;background:#f2f5f8;border-radius:8px}.content hr{border:0;border-top:1px solid var(--line);margin:1.5em 0}.warning{color:#8a4b08}.error{color:#b42318}.source{overflow-wrap:anywhere}
    .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form-grid label{font-size:12px;font-weight:700;color:var(--muted)}select,input,textarea{display:block;width:100%;margin-top:5px;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;font:inherit}.full{grid-column:1/-1}.timeline{display:grid;gap:8px;margin-top:18px}.event{position:relative;padding:11px 86px 11px 11px;border-left:4px solid var(--blue);background:#f6f8fb;border-radius:7px;cursor:pointer}.event:hover{background:#edf3ff}.event strong{display:block}.event span{font-size:12px;color:var(--muted)}.delete-event{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:0;background:none;color:#b42318;font:inherit;font-weight:700;cursor:pointer;padding:7px}.hidden{display:none}
    .documents{margin-top:24px;padding-top:20px;border-top:1px solid var(--line)}.documents h3{margin:0 0 8px}.document-list{display:grid;gap:8px;margin-top:14px}.document-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px;background:#f6f8fb;border-radius:8px}.document-row span{display:block;font-size:12px;color:var(--muted);margin-top:3px}.document-actions{display:flex;gap:8px;flex-shrink:0}.document-actions a,.document-actions button{font:inherit;font-weight:700;color:var(--blue);background:none;border:0;padding:5px;cursor:pointer}.document-warning{padding:10px;border-radius:8px;background:#fff4e5;color:#8a4b08}
    details.inline-editor{margin-top:18px;border-top:1px solid var(--line);padding-top:15px}details.inline-editor summary{cursor:pointer;color:var(--blue);font-weight:700}.application-overview{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}.application-overview span{padding:8px 11px;border-radius:8px;background:#f6f8fb}
    @media(max-width:750px){header{align-items:flex-start;flex-direction:column}.meta,.form-grid{grid-template-columns:1fr}.full{grid-column:auto}}
  </style>
</head>
<body>
  <header>
    <div><h1 id="title">Jobdetails</h1><p id="subtitle">Stellenanzeige wird geladen …</p></div>
    <div class="actions">
      <a class="nav-link" href="/">Dashboard</a>
      <a class="nav-link" href="/jobs">Jobübersicht</a>
      <a class="nav-link" href="/manage#job-import">Job importieren</a>
      <a class="nav-link" id="matchingLink" href="/matching/admin">Matching</a>
    </div>
  </header>
  <main>
    <section class="panel">
      <div class="meta" id="meta"></div>
      <p class="source" id="source"></p>
      <div class="warning" id="warnings"></div>
      <details class="inline-editor" id="metadataEditor">
        <summary>Job-Metadaten bearbeiten</summary>
        <form id="metadataForm">
          <div class="form-grid" style="margin-top:14px">
            <label>Jobtitel<input id="metadataTitle" maxlength="500"></label>
            <label>Firma<input id="metadataCompany" maxlength="300"></label>
            <label>Ort<input id="metadataLocation" maxlength="500"></label>
            <label>Arbeitsmodell<input id="metadataWorkModel" maxlength="50" placeholder="z. B. Hybrid"></label>
            <label>Beschäftigungsart<input id="metadataEmploymentType" maxlength="100" placeholder="z. B. Vollzeit"></label>
            <label>Befristung<input id="metadataContractTerm" maxlength="200" placeholder="z. B. befristet für 24 Monate"></label>
            <label>Quellportal<input id="metadataSourcePortal" maxlength="300" list="sourcePortalNames" placeholder="z. B. Indeed">
              <datalist id="sourcePortalNames"><option value="LinkedIn"><option value="Indeed"><option value="Instaffo"><option value="StepStone"><option value="XING"><option value="Bundesagentur für Arbeit"></datalist>
            </label>
            <label>Sprache<select id="metadataLanguage"><option value="">Nicht angegeben</option><option value="de">Deutsch</option><option value="en">Englisch</option></select></label>
            <label>Veröffentlicht am<input id="metadataPublishedAt" type="date"></label>
            <label>Bewerbungsfrist<input id="metadataDeadline" type="date"></label>
          </div>
          <p><button class="button strong" id="saveMetadata" type="submit">Metadaten speichern</button></p>
        </form>
      </details>
    </section>
    <section class="panel">
      <h2>Bewerbungsverlauf</h2>
      <div class="application-overview" id="applicationOverview"></div>
      <details class="inline-editor" id="applicationEditor">
        <summary>Bewerbungsstatus und Unterlagen bearbeiten</summary>
        <form id="applicationForm">
        <div class="form-grid">
          <label>Profil<select id="profile"></select></label>
          <label>Status<select id="applicationStatus">
            <option value="draft">Entwurf</option><option value="applied">Beworben</option>
            <option value="followed_up">Nachgefragt</option><option value="interview">Vorstellungsgespräch</option>
            <option value="rejected">Abgelehnt</option><option value="offer">Angebot erhalten</option>
            <option value="accepted">Angenommen</option><option value="withdrawn">Zurückgezogen</option><option value="closed">Geschlossen</option>
          </select></label>
          <label>Datum und Uhrzeit<input id="occurredAt" type="datetime-local"></label>
          <label>Kommunikationsweg<select id="channel"><option value="">Nicht angegeben</option><option value="email">E-Mail</option><option value="company_portal">Arbeitgeberportal</option><option value="job_portal">Jobportal</option><option value="phone">Telefon</option><option value="personal">Persönlich</option><option value="other">Sonstiges</option></select></label>
          <label id="portalNameField" class="hidden">Jobportal
            <input id="portalName" maxlength="100" list="jobPortalNames" placeholder="z. B. LinkedIn">
            <datalist id="jobPortalNames"><option value="LinkedIn"><option value="Indeed"><option value="Instaffo"><option value="StepStone"><option value="XING"><option value="Bundesagentur für Arbeit"></datalist>
          </label>
          <label class="full">Notiz<textarea id="applicationNote" rows="3" placeholder="Optionale Notiz zum Statuswechsel"></textarea></label>
        </div>
        <p><button class="button" id="saveStatus" type="submit">Bewerbungsstatus speichern</button> <button class="button secondary hidden" id="cancelEdit" type="button">Bearbeitung abbrechen</button></p>
        </form>
        <div class="documents">
        <h3>Abgeschickte Unterlagen</h3>
        <p id="documentHint">Speichere zuerst einen Bewerbungsstatus, um Unterlagen zu hinterlegen.</p>
        <div id="documentWarning"></div>
        <form id="documentForm" class="hidden">
          <div class="form-grid">
            <label>Dokumentart<select id="documentType">
              <option value="cover_letter">Anschreiben</option>
              <option value="resume">Lebenslauf</option>
              <option value="certificate">Zeugnis</option>
              <option value="other">Sonstige Anlage</option>
            </select></label>
            <label>PDF-Datei<input id="documentFile" type="file" accept="application/pdf,.pdf" required></label>
          </div>
          <p><button class="button strong" id="uploadDocument" type="submit">PDF hochladen</button></p>
        </form>
        <div class="document-list" id="documentList"></div>
        </div>
      </details>
      <div class="timeline" id="timeline"></div>
    </section>
    <section class="panel">
      <h2>Importierter Inhalt</h2>
      <div class="content" id="content"></div>
    </section>
  </main>
  <script>
    const esc=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
    const formatDate=value=>value?new Intl.DateTimeFormat("de-DE",{dateStyle:"medium"}).format(new Date(value)):"nicht angegeben";
    const jobId=decodeURIComponent(location.pathname.split("/").filter(Boolean).pop()||"");
    const sourceName=job=>{
      if(job.source_url){try{return new URL(job.source_url).origin}catch{}}
      return job.source_filename||job.source_portal||"Unbekannte Quelle";
    };
    const statusLabels={draft:"Entwurf",applied:"Beworben",followed_up:"Nachgefragt",interview:"Vorstellungsgespräch",rejected:"Abgelehnt",offer:"Angebot erhalten",accepted:"Angenommen",withdrawn:"Zurückgezogen",closed:"Geschlossen"};
    const channelLabels={email:"E-Mail",company_portal:"Arbeitgeberportal",job_portal:"Jobportal",phone:"Telefon",personal:"Persönlich",other:"Sonstiges"};
    const documentLabels={resume:"Lebenslauf",cover_letter:"Anschreiben",certificate:"Zeugnis",other:"Sonstige Anlage"};
    let currentJob=null,currentApplication=null,editingEventId=null,currentEvents=[],currentFiles=[];
    async function request(url,options={}){
      const response=await fetch(url,{...options,headers:{"Content-Type":"application/json",...(options.headers||{})}});
      const data=await response.json().catch(()=>({}));
      if(!response.ok)throw new Error(data.error?.message||`HTTP ${response.status}`);
      return data;
    }
    function localNow(){const date=new Date(),offset=date.getTimezoneOffset()*60000;return new Date(date-offset).toISOString().slice(0,16)}
    function localDateTime(value){if(!value)return localNow();const date=new Date(value),offset=date.getTimezoneOffset()*60000;return new Date(date-offset).toISOString().slice(0,16)}
    function syncPortalName(){
      const isJobPortal=document.getElementById("channel").value==="job_portal";
      document.getElementById("portalNameField").classList.toggle("hidden",!isJobPortal);
      document.getElementById("portalName").required=isJobPortal;
      if(!isJobPortal)document.getElementById("portalName").value="";
    }
    function resetEventEditor(){
      editingEventId=null;
      document.getElementById("saveStatus").textContent="Bewerbungsstatus speichern";
      document.getElementById("cancelEdit").classList.add("hidden");
      document.getElementById("applicationStatus").value=currentApplication?.status||"draft";
      document.getElementById("occurredAt").value=localNow();
      document.getElementById("channel").value=currentApplication?.response_channel||currentApplication?.application_channel||"";
      document.getElementById("portalName").value=currentApplication?.response_portal_name||currentApplication?.application_portal_name||"";
      syncPortalName();
      document.getElementById("applicationNote").value="";
    }
    function editEvent(eventId){
      const event=currentEvents.find(item=>item.id===eventId);if(!event)return;
      editingEventId=event.id;
      document.getElementById("applicationStatus").value=event.status||currentApplication?.status||"draft";
      document.getElementById("occurredAt").value=localDateTime(event.occurred_at);
      document.getElementById("channel").value=event.channel||"";
      document.getElementById("portalName").value=event.portal_name||"";
      syncPortalName();
      document.getElementById("applicationNote").value=event.note||"";
      document.getElementById("saveStatus").textContent="Statuseintrag aktualisieren";
      document.getElementById("cancelEdit").classList.remove("hidden");
      document.getElementById("applicationEditor").open=true;
      document.getElementById("applicationForm").scrollIntoView({behavior:"smooth",block:"center"});
    }
    function renderTimeline(events){
      currentEvents=events;
      document.getElementById("timeline").innerHTML=events.length?events.map(event=>`<article class="event" data-event-id="${esc(event.id)}" title="Zum Bearbeiten anklicken"><strong>${esc(statusLabels[event.status]||event.event_type)}</strong><span>${esc(formatDate(event.occurred_at))}${event.channel?` · ${esc(channelLabels[event.channel]||event.channel)}${event.portal_name?` (${esc(event.portal_name)})`:""}`:""}</span>${event.note?`<div>${esc(event.note)}</div>`:""}<button type="button" class="delete-event" data-delete-event-id="${esc(event.id)}" title="Eintrag löschen">Löschen</button></article>`).join(""):`<p class="warning">Noch kein Bewerbungsverlauf vorhanden.</p>`;
      document.querySelectorAll(".event[data-event-id]").forEach(element=>element.onclick=()=>editEvent(element.dataset.eventId));
      document.querySelectorAll("[data-delete-event-id]").forEach(button=>button.onclick=event=>{event.stopPropagation();deleteEvent(button.dataset.deleteEventId)});
    }
    async function deleteEvent(eventId){
      if(!confirm("Diesen Eintrag aus dem Bewerbungsverlauf wirklich löschen?"))return;
      try{
        const response=await fetch(`/applications/${encodeURIComponent(currentApplication.id)}/events/${encodeURIComponent(eventId)}`,{method:"DELETE"});
        if(!response.ok){const data=await response.json().catch(()=>({}));throw new Error(data.error?.message||`HTTP ${response.status}`)}
        await loadApplication();
      }catch(error){alert(error.message)}
    }
    function formatBytes(value){
      if(value<1024)return `${value} B`;if(value<1048576)return `${(value/1024).toFixed(1)} KB`;return `${(value/1048576).toFixed(1)} MB`;
    }
    function renderDocuments(files){
      currentFiles=files;
      const form=document.getElementById("documentForm"),hint=document.getElementById("documentHint");
      form.classList.toggle("hidden",!currentApplication);
      hint.textContent=currentApplication?"Hier werden Kopien der tatsächlich versendeten PDF-Dateien archiviert.":"Speichere zuerst einen Bewerbungsstatus, um Unterlagen zu hinterlegen.";
      const types=new Set(files.map(file=>file.document_type));
      const missing=currentApplication?.status==="applied"&&!types.has("resume");
      document.getElementById("documentWarning").innerHTML=missing?'<p class="document-warning">Für diese Bewerbung ist noch kein Lebenslauf hinterlegt.</p>':"";
      document.getElementById("documentList").innerHTML=files.length?files.map(file=>`
        <article class="document-row">
          <div><strong>${esc(documentLabels[file.document_type]||file.document_type)} · ${esc(file.original_filename)}</strong><span>${esc(formatDate(file.submitted_at||file.created_at))} · ${esc(formatBytes(file.file_size))}</span></div>
          <div class="document-actions"><a href="/applications/${encodeURIComponent(currentApplication.id)}/files/${encodeURIComponent(file.id)}/content" target="_blank" rel="noopener">Ansehen</a><button type="button" data-file-id="${esc(file.id)}">Löschen</button></div>
        </article>`).join(""):(currentApplication?'<p class="warning">Noch keine abgeschickten Unterlagen hinterlegt.</p>':"");
      document.querySelectorAll("[data-file-id]").forEach(button=>button.onclick=()=>deleteDocument(button.dataset.fileId));
    }
    async function loadDocuments(){
      if(!currentApplication){renderDocuments([]);return}
      renderDocuments(await request(`/applications/${encodeURIComponent(currentApplication.id)}/files`));
    }
    async function deleteDocument(fileId){
      if(!confirm("Diese archivierte PDF-Datei wirklich löschen?"))return;
      try{
        const response=await fetch(`/applications/${encodeURIComponent(currentApplication.id)}/files/${encodeURIComponent(fileId)}`,{method:"DELETE"});
        if(!response.ok){const data=await response.json().catch(()=>({}));throw new Error(data.error?.message||`HTTP ${response.status}`)}
        await loadDocuments();
      }catch(error){alert(error.message)}
    }
    async function loadApplication(){
      const profileId=document.getElementById("profile").value;if(!profileId)return;
      const data=await request(`/applications/by-job/${encodeURIComponent(jobId)}?profile_id=${encodeURIComponent(profileId)}`);
      currentApplication=data.application;
      document.getElementById("applicationOverview").innerHTML=currentApplication
        ? `<span><strong>Status:</strong> ${esc(statusLabels[currentApplication.status]||currentApplication.status)}</span>${currentApplication.applied_at?`<span><strong>Beworben am:</strong> ${esc(formatDate(currentApplication.applied_at))}</span>`:""}`
        : "<span>Noch kein Bewerbungsstatus gespeichert.</span>";
      renderTimeline(data.events||[]);
      resetEventEditor();
      await loadDocuments();
    }
    async function load(){
      try{
        const [data,profiles]=await Promise.all([request(`/matching/jobs/${encodeURIComponent(jobId)}`),request("/profiles")]);
        currentJob=data;
        document.title=`${data.title} · Application Assistant`;
        document.getElementById("title").textContent=data.title;
        document.getElementById("subtitle").textContent=`${data.company||"Firma unbekannt"} · ${sourceName(data)}`;
        document.getElementById("matchingLink").href=`/matching/admin?job_id=${encodeURIComponent(data.id)}`;
        document.getElementById("meta").innerHTML=[
          ["Firma",data.company||"nicht erkannt"],
          ["Ort",data.location||"nicht angegeben"],
          ["Arbeitsmodell",data.work_model||"nicht angegeben"],
          ["Beschäftigungsart",data.employment_type||"nicht angegeben"],
          ["Befristung",data.contract_term||"nicht angegeben"],
          ["Quellportal",data.source_portal||"nicht angegeben"],
          ["Veröffentlicht",data.published_text||(data.published_at?formatDate(data.published_at):"nicht angegeben")],
          ["Importiert",formatDate(data.imported_at)]
        ].map(([label,value])=>`<div><strong>${esc(label)}</strong>${esc(value)}</div>`).join("");
        const source=document.getElementById("source");
        source.innerHTML=data.source_url
          ? `<strong>Quelle:</strong> <a href="${esc(data.source_url)}" target="_blank" rel="noopener">${esc(sourceName(data))}</a>`
          : `<strong>Quelldatei:</strong> ${esc(sourceName(data))}`;
        document.getElementById("warnings").textContent=(data.import_warnings||[]).length?`Importhinweise: ${data.import_warnings.join(" · ")}`:"";
        document.getElementById("metadataTitle").value=data.title||"";
        document.getElementById("metadataCompany").value=data.company||"";
        document.getElementById("metadataLocation").value=data.location||"";
        document.getElementById("metadataWorkModel").value=data.work_model||"";
        document.getElementById("metadataEmploymentType").value=data.employment_type||"";
        document.getElementById("metadataContractTerm").value=data.contract_term||"";
        document.getElementById("metadataSourcePortal").value=data.source_portal||"";
        document.getElementById("metadataLanguage").value=data.language||"";
        document.getElementById("metadataPublishedAt").value=data.published_at||"";
        document.getElementById("metadataDeadline").value=data.deadline||"";
        document.getElementById("content").innerHTML=data.content_html||"<p>Kein Inhalt gespeichert.</p>";
        document.querySelectorAll("#content a").forEach(link=>{link.target="_blank";link.rel="noopener noreferrer"});
        document.getElementById("profile").innerHTML=profiles.map(profile=>`<option value="${profile.id}">${esc(profile.display_name)}</option>`).join("");
        document.getElementById("profile").onchange=loadApplication;
        document.getElementById("occurredAt").value=localNow();
        await loadApplication();
      }catch(error){
        document.getElementById("subtitle").textContent="Job konnte nicht geladen werden.";
        document.getElementById("content").innerHTML=`<p class="error">${esc(error.message)}</p>`;
      }
    }
    document.getElementById("applicationForm").onsubmit=async event=>{
      event.preventDefault();
      const body={
        status:document.getElementById("applicationStatus").value,
        occurred_at:new Date(document.getElementById("occurredAt").value).toISOString(),
        channel:document.getElementById("channel").value||null,
        portal_name:document.getElementById("channel").value==="job_portal"?document.getElementById("portalName").value.trim()||null:null,
        note:document.getElementById("applicationNote").value.trim()||null
      };
      try{
        if(editingEventId)await request(`/applications/${currentApplication.id}/events/${editingEventId}`,{method:"PATCH",body:JSON.stringify(body)});
        else if(currentApplication)await request(`/applications/${currentApplication.id}`,{method:"PATCH",body:JSON.stringify(body)});
        else await request("/applications",{method:"POST",body:JSON.stringify({...body,job_id:jobId,profile_id:document.getElementById("profile").value})});
        await loadApplication();
      }catch(error){alert(error.message)}
    };
    document.getElementById("channel").onchange=syncPortalName;
    document.getElementById("metadataForm").onsubmit=async event=>{
      event.preventDefault();
      const value=id=>document.getElementById(id).value.trim()||null;
      const button=document.getElementById("saveMetadata");
      button.disabled=true;
      try{
        await request(`/matching/jobs/${encodeURIComponent(jobId)}/metadata`,{
          method:"PATCH",
          body:JSON.stringify({
            title:value("metadataTitle"),
            company:value("metadataCompany"),
            location:value("metadataLocation"),
            work_model:value("metadataWorkModel"),
            employment_type:value("metadataEmploymentType"),
            contract_term:value("metadataContractTerm"),
            source_portal:value("metadataSourcePortal"),
            language:value("metadataLanguage"),
            published_at:value("metadataPublishedAt"),
            deadline:value("metadataDeadline")
          })
        });
        location.reload();
      }catch(error){alert(error.message)}finally{button.disabled=false}
    };
    document.getElementById("documentForm").onsubmit=async event=>{
      event.preventDefault();
      if(!currentApplication)return;
      const input=document.getElementById("documentFile"),file=input.files[0],button=document.getElementById("uploadDocument");
      if(!file)return;
      const form=new FormData();
      form.append("file",file);
      form.append("document_type",document.getElementById("documentType").value);
      if(document.getElementById("occurredAt").value)form.append("submitted_at",new Date(document.getElementById("occurredAt").value).toISOString());
      button.disabled=true;
      try{
        const response=await fetch(`/applications/${encodeURIComponent(currentApplication.id)}/files`,{method:"POST",body:form});
        const data=await response.json().catch(()=>({}));
        if(!response.ok)throw new Error(data.error?.message||`HTTP ${response.status}`);
        input.value="";
        await loadDocuments();
      }catch(error){alert(error.message)}finally{button.disabled=false}
    };
    document.getElementById("cancelEdit").onclick=resetEventEditor;
    load();
  </script>
</body>
</html>
