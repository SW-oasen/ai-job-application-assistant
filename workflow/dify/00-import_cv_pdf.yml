    - data:
        code: |
          import json

          def main(body: str, status_code: int) -> dict:
              data = json.loads(body)
              if status_code != 200:
                  error = data.get("error") or {}
                  code = error.get("code", f"http_{status_code}")
                  message = error.get("message", "Backend request failed")
                  raise ValueError(f"{code}: {message}")
              suggestions = data.get("suggestions") or []
              return {
                  "import_id": data.get("id", ""),
                  "suggestion_count": len(suggestions),
                  "status": data.get("status", ""),
              }
        code_language: python3
        desc: Gibt Backendfehler verständlich und ohne automatische Wiederholung zurück.
        outputs:
          import_id:
            children: null
            type: string
          status:
