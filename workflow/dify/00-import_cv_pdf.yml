    - data:
        code: |
          import json
          import re

          def main(
              profile_id: str,
              source_filename: str,
              source_language: str,
              structured_cv: dict,
          ) -> dict:
              profile_id = profile_id.strip()
              if not re.fullmatch(
                  r"[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-"
                  r"[0-9a-fA-F]{4}-[0-9a-fA-F]{12}",
                  profile_id,
              ):
                  raise ValueError("profile_id must be a UUID from profile administration")
              if source_language not in ("de", "en"):
                  raise ValueError("source_language must be de or en")
              if not isinstance(structured_cv, dict):
                  raise ValueError("structured_cv must contain one JSON object")
              payload = {
                  "source_filename": source_filename.strip() or "lebenslauf.pdf",
                  "source_language": source_language,
                  "structured_cv": structured_cv,
              }
              return {
                  "profile_id": profile_id,
                  "payload_json": json.dumps(payload, ensure_ascii=False),
              }
        code_language: python3
        desc: Validiert Zielprofil und Extraktion; erstellt nur prüfbare Vorschläge.
        outputs:
          payload_json:
            children: null
            type: string
          profile_id:
            children: null
            type: string
        selected: false
        title: Prepare Profile Import
        type: code
        variables:
