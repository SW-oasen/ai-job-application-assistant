                          type: string
                        level:
                          description: Proficiency level exactly as stated; use an
                            empty string if absent.
                          type: string
                      required:
                      - language
                      - level
                      type: object
                    type: array
                required:
                - categories
                - languages
                type: object
              work_experience:
                description: Work experience entries explicitly present in the source
                  document.
                items:
                  additionalProperties: false
                  properties:
                    activities:
                      description: Responsibilities and activities stated for this
                        role, without inference.
                      items:
                        type: string
                      type: array
                    company:
                      description: Employer or organization exactly as stated.
                      type: string
                    end_date:
                      description: End date exactly as stated; use an empty string
                        if unavailable.
                      type: string
                    job_title:
                      description: Job title exactly as stated.
                      type: string
                    start_date:
                      description: Start date exactly as stated; use an empty string
                        if unavailable.
                      type: string
                  required:
                  - company
                  - job_title
                  - start_date
                  - end_date
                  - activities
                  type: object
                type: array
            required:
            - profile
            - skills
            - work_experience
            - education
            - certificates
            - references
            type: object
