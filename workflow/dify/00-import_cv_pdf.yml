          name: qwen3:8b
          provider: langgenius/ollama/ollama
        prompt_template:
        - id: cffcf4f8-5865-4858-b6c1-740c7afa415e
          role: system
          text: 'You are a deterministic CV data extraction engine.


            Extract only information explicitly present in the supplied CV.


            Rules:


            1. Never invent, infer, complete, or simulate information.

            2. Preserve the wording of descriptions and activities.

            3. Use null, empty strings, empty objects, or empty arrays for missing
            values.

            4. Do not add projects unless a project section is explicitly present
            in the CV.

            5. Do not interpret nationality as location.

            6. Natural languages belong under skills.languages.

            7. Preserve the skill categories from the source document.

            8. Do not generate evidence fields.

            9. Do not add employment type, work location, or current-status fields.

            10. Normalize dates only when the month and year are explicitly available.

            11. Return valid JSON matching the configured structured-output schema.

            12. REFERENCES section. Preserve names, professional titles, companies,
            and LinkedIn URLs. If only the word "LinkedIn" is available but no URL
            target was extracted, return an empty string for linkedin.

            13. Return no explanation or additional text.'
        - id: 15198a09-509f-46cc-8ca3-b59861c36bfc
          role: user
          text: "Extract the CV below into the configured structured output. The content\
            \ between CV_START and CV_END is the only permitted source. \nCV_START\
            \ \n{{#1784653040514.text#}}\nCV_END \nBefore extraction, verify that\
            \ the supplied content contains actual CV information. Do not use prior\
            \ knowledge, examples, templates, or imagined content."
        selected: false
        structured_output:
          schema:
            additionalProperties: false
            properties:
              certificates:
                description: Certificates explicitly present in the source document.
                items:
                  additionalProperties: false
                  properties:
                    date:
                      description: Certification date exactly as stated; use an empty
                        string if absent.
                      type: string
                    institution:
                      description: Issuing institution exactly as stated; use an empty
                        string if absent.
                      type: string
                    name:
                      description: Certificate name exactly as stated.
                      type: string
                  required:
                  - name
                  - institution
                  - date
                  type: object
                type: array
              education:
                description: Education and formal training entries explicitly present
                  in the source document.
                items:
                  additionalProperties: false
                  properties:
                    date:
                      description: Date or date range exactly as stated; use an empty
                        string if absent.
                      type: string
                    field:
                      description: Field of study or specialization exactly as stated;
                        use an empty string if absent.
                      type: string
                    institution:
                      description: Institution or university exactly as stated.
                      type: string
                    qualification:
                      description: Qualification, degree, or training name exactly
                        as stated.
                      type: string
                  required:
                  - qualification
                  - institution
                  - date
                  - field
                  type: object
                type: array
              profile:
                additionalProperties: false
                properties:
                  email:
                    description: Email address exactly as stated; use an empty string
                      if absent.
                    type: string
                  github:
                    description: GitHub URL or identifier exactly as stated; use an
                      empty string if absent.
                    type: string
                  linkedin:
                    description: LinkedIn URL or identifier exactly as stated; use
                      an empty string if absent.
                    type: string
                  name:
                    description: Full name exactly as stated in the source document;
                      use an empty string if absent.
                    type: string
                  nationality:
                    description: Nationality only if explicitly stated in the source
                      document; otherwise use an empty string.
                    type: string
                  phone:
                    description: Phone number exactly as stated; use an empty string
                      if absent.
                    type: string
                  portfolio:
                    description: Portfolio URL exactly as stated; use an empty string
                      if absent.
                    type: string
                  professional_title:
                    description: Professional titles or roles explicitly stated in
                      the source document.
                    items:
                      type: string
                    type: array
                  summary:
                    description: Profile summary from the source document without
                      invented information; use an empty string if absent.
                    type: string
                required:
                - name
                - professional_title
                - nationality
                - phone
                - email
                - linkedin
                - portfolio
                - github
                - summary
                type: object
              references:
                description: Professional references explicitly present in the source
                  document.
                items:
                  additionalProperties: false
                  properties:
                    company:
                      description: Reference person's company or organization exactly
                        as stated; use an empty string if absent.
                      type: string
                    job_title:
                      description: Reference person's professional title exactly as
                        stated; use an empty string if absent.
                      type: string
                    linkedin:
                      description: LinkedIn URL exactly as extracted from the source
                        document; use an empty string if the URL target is unavailable.
                      type: string
                    name:
                      description: Reference person's name exactly as stated.
                      type: string
                  required:
                  - name
                  - job_title
                  - company
                  - linkedin
                  type: object
                type: array
              skills:
                additionalProperties: false
                properties:
                  categories:
                    description: Technical and professional skill categories explicitly
                      present in the source document.
                    items:
                      additionalProperties: false
                      properties:
                        category:
                          description: Skill category exactly as stated.
                          type: string
                        skills:
                          description: Skills explicitly listed within the category.
                          items:
                            type: string
                          type: array
                      required:
                      - category
                      - skills
                      type: object
                    type: array
                  languages:
                    description: Natural languages explicitly stated in the source
