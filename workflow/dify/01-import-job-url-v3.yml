        type: http-request
        url: http://application-assistant-backend:8080/imports/url
      height: 176
      id: http
      position:
        x: 334
        y: 220
      positionAbsolute:
        x: 334
        y: 220
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: |
          import json

          def main(body: str, status_code: int) -> dict:
              if status_code != 200:
                  try:
                      data = json.loads(body)
                  except (TypeError, json.JSONDecodeError):
                      data = {}
                  error = data.get("error", {})
                  code = error.get("code", "job_import_failed")
                  message = error.get("message", f"Backend returned HTTP {status_code}")
                  source_status = (error.get("details") or {}).get("source_status")
                  if source_status in (403, 429):
                      message = (
                          f"Die Quellseite blockiert den automatisierten Abruf (HTTP {source_status}). "
                          "Bitte die Stellenanzeige im Browser als PDF speichern und per PDF importieren."
                      )
                  raise ValueError(f"{code}: {message}")
              data = json.loads(body)
              if not data.get("success"):
                  error = data.get("error") or {}
                  return {
                      "import_status": "failed",
                      "error_code": error.get("code", "job_import_failed"),
                      "error_message": error.get(
                          "message",
                          "Die Stellenanzeige konnte nicht importiert werden.",
                      ),
                      "markdown": "",
                      "job_id": "",
                      "source_url": data.get("source_url", ""),
                      "retrieval_method": data.get("retrieval_method", ""),
                      "warnings_text": ", ".join(data.get("warnings") or []),
                      "needs_manual_review": True,
                  }
              markdown = data.get("markdown", "").strip()
              if not markdown:
                  raise ValueError("Backend returned no usable job content")
              warnings = data.get("warnings") or []
              job_id = data.get("job_id") or ""
              quality_sufficient = bool(data.get("quality_sufficient", False))
              if quality_sufficient and not job_id:
                  raise ValueError("Backend imported usable content but returned no job_id")
              return {
                  "import_status": "success",
                  "error_code": "",
                  "error_message": "",
                  "markdown": markdown,
                  "job_id": job_id,
                  "source_url": data.get("source_url", ""),
                  "retrieval_method": data.get("retrieval_method", ""),
                  "warnings_text": ", ".join(warnings),
                  "needs_manual_review": not quality_sufficient,
              }
        code_language: python3
        desc: Prüft ausschließlich den Backend-Vertrag und bereitet kleine Routing-Felder auf.
